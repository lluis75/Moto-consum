<!DOCTYPE html>
<html lang="ca">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Consum Moto L/100km</title>
<meta name="theme-color" content="#D9731C" />
<link rel="manifest" href="manifest.json" />
<link rel="icon" href="icons/icon-192.png" />
<link rel="apple-touch-icon" href="icons/icon-192.png" />
<style>
  :root{
    --bg:#F1EFE8; --card:#FFFFFF; --border:#D3D1C7;
    --text:#2C2C2A; --text-2:#5F5E5A; --accent:#D9731C; --accent-dark:#8A4A0F;
    --danger:#A32D2D;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#1c1c1a; --card:#26261f; --border:#444441;
      --text:#F1EFE8; --text-2:#B4B2A9; --accent:#F0954A; --accent-dark:#F7C08A;
      --danger:#F09595;
    }
  }
  *{box-sizing:border-box;}
  body{
    margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    background:var(--bg); color:var(--text); padding:1.25rem;
    padding-bottom:calc(1.25rem + env(safe-area-inset-bottom));
  }
  h1{font-size:20px;font-weight:600;margin:0 0 1rem;}
  .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:1.25rem;}
  .stat{background:var(--card);border:0.5px solid var(--border);border-radius:12px;padding:0.9rem;}
  .stat p:first-child{font-size:12px;color:var(--text-2);margin:0 0 4px;}
  .stat p:last-child{font-size:19px;font-weight:600;margin:0;}
  .card{background:var(--card);border:0.5px solid var(--border);border-radius:14px;padding:1rem 1.1rem;margin-bottom:1.25rem;}
  .card h2{font-size:15px;font-weight:600;margin:0;}
  .card-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;}
  .row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px;}
  label{font-size:12px;color:var(--text-2);display:block;margin-bottom:3px;}
  input{
    width:100%;height:38px;border:1px solid var(--border);border-radius:8px;
    padding:0 10px;font-size:15px;background:transparent;color:var(--text);
  }
  input:focus{outline:none;border-color:var(--accent);}
  button{
    width:100%;height:42px;border:none;border-radius:8px;background:var(--accent);
    color:#fff;font-size:15px;font-weight:600;cursor:pointer;margin-top:2px;
  }
  button:active{opacity:0.85;}
  .err{font-size:12px;color:var(--danger);margin:8px 0 0;display:none;}
  .history{border:0.5px solid var(--border);border-radius:12px;overflow:hidden;}
  .hrow{display:flex;justify-content:space-between;align-items:center;padding:10px 12px;border-top:0.5px solid var(--border);gap:10px;}
  .hrow:first-child{border-top:none;}
  .hrow .main{display:flex;flex-direction:column;gap:2px;min-width:0;flex:1;}
  .hrow .odo{font-size:16px;font-weight:600;}
  .hrow .sub{font-size:12px;color:var(--text-2);}
  .hrow .cons{font-size:14px;font-weight:600;text-align:right;flex-shrink:0;}
  .hrow .cons.start{font-size:12px;font-weight:500;color:var(--text-2);}
  .empty{font-size:13px;color:var(--text-2);padding:1rem;margin:0;}
  .del-btn{
    width:26px;height:26px;min-width:26px;border-radius:50%;background:transparent;
    border:1px solid var(--border);color:var(--danger);font-size:14px;font-weight:700;
    display:flex;align-items:center;justify-content:center;padding:0;margin:0;cursor:pointer;
  }
  .reset-link{
    width:auto;height:auto;background:none;color:var(--danger);font-size:12px;font-weight:500;
    text-decoration:underline;padding:0;margin:0;
  }
  .backup{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .backup button, .backup label.btn{
    height:42px;border:1px solid var(--border);border-radius:8px;background:transparent;color:var(--text);
    font-size:14px;font-weight:600;cursor:pointer;display:flex;align-items:center;justify-content:center;
    margin:0;text-align:center;
  }
  .backup button:active, .backup label.btn:active{opacity:0.7;}
  .note{font-size:12px;color:var(--text-2);margin:10px 0 0;}
  .note.ok{color:var(--accent);}
  .note.bad{color:var(--danger);}
</style>
</head>
<body>

<h1>Consum de la moto</h1>

<div class="stats">
  <div class="stat"><p>Consum mitjà</p><p id="avg">–</p></div>
  <div class="stat"><p>Km totals</p><p id="km">–</p></div>
  <div class="stat"><p>Litres totals</p><p id="liters">–</p></div>
</div>

<div class="card">
  <h2>Nou repostatge</h2>
  <div class="row" style="margin-top:12px;">
    <div>
      <label>Data</label>
      <input type="date" id="in-date" />
    </div>
    <div>
      <label>Quilometratge actual</label>
      <input type="number" id="in-km" placeholder="12300" inputmode="decimal" />
    </div>
  </div>
  <label>Litres repostats</label>
  <input type="number" step="0.01" id="in-liters" placeholder="8.5" inputmode="decimal" style="margin-bottom:12px;" />
  <button id="add-btn">+ Afegeix repostatge</button>
  <p class="err" id="err"></p>
</div>

<div class="card">
  <div class="card-head">
    <h2>Historial</h2>
    <button class="reset-link" id="reset-btn">Esborra-ho tot</button>
  </div>
  <div class="history" id="history">
    <p class="empty" id="empty">Encara no hi ha repostatges. Afegeix-ne un per començar a calcular el consum.</p>
  </div>
</div>

<div class="card">
  <div class="card-head"><h2>Còpia de seguretat</h2></div>
  <div class="backup">
    <button id="export-btn">Exporta les dades</button>
    <label class="btn" for="import-file">Importa les dades</label>
    <input type="file" id="import-file" accept=".json,application/json" style="display:none;" />
  </div>
  <p class="note" id="backup-note">Exporta els repostatges a un fitxer per guardar-los o passar-los a un altre mòbil.</p>
</div>

<script>
const KEY = 'moto-fuel-entries';
let entries = JSON.parse(localStorage.getItem(KEY) || '[]');

const $ = id => document.getElementById(id);
$('in-date').value = new Date().toISOString().slice(0,10);

function fmt1(n){ return (Math.round(n*10)/10).toLocaleString('ca-ES'); }

function persist(){ localStorage.setItem(KEY, JSON.stringify(entries)); }

function fmtDate(s){ const p = s.split('-'); return p.length===3 ? p[2]+'/'+p[1]+'/'+p[0] : s; }
function fmtKm(n){ return n.toLocaleString('ca-ES', {maximumFractionDigits:1}); }

function render(){
  const sorted = [...entries].sort((a,b)=>a.km-b.km);
  let totalKm=0, totalLiters=0;

  const rows = sorted.map((e,i)=>{
    if(i===0) return {...e, first:true};
    const dKm = e.km - sorted[i-1].km;
    totalKm += dKm; totalLiters += e.liters;
    return {...e, dKm, cons:(e.liters/dKm)*100};
  });

  $('km').textContent = totalKm ? fmt1(totalKm)+' km' : '–';
  $('liters').textContent = totalLiters ? fmt1(totalLiters)+' L' : '–';
  $('avg').textContent = totalKm ? fmt1(totalLiters/totalKm*100)+' L/100km' : '–';

  const hist = $('history');
  hist.innerHTML = '';
  if(rows.length===0){
    hist.innerHTML = '<p class="empty">Encara no hi ha repostatges. Afegeix-ne un per començar a calcular el consum.</p>';
    return;
  }
  rows.reverse().forEach(r=>{
    const el = document.createElement('div');
    el.className='hrow';
    const detail = r.first
      ? fmtDate(r.date)+' · '+fmt1(r.liters)+' L'
      : fmtDate(r.date)+' · +'+fmtKm(r.dKm)+' km · '+fmt1(r.liters)+' L';
    const cons = r.first
      ? '<span class="cons start">Punt de partida</span>'
      : '<span class="cons">'+fmt1(r.cons)+' L/100km</span>';
    el.innerHTML = '<div class="main"><span class="odo">'+fmtKm(r.km)+' km</span><span class="sub">'+detail.replace(/ (km|L)/g,'\u00a0$1')+'</span></div>'
      + cons
      + '<button class="del-btn" data-km="'+r.km+'" title="Elimina aquest repostatge" aria-label="Elimina aquest repostatge">✕</button>';
    hist.appendChild(el);
  });

  hist.querySelectorAll('.del-btn').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const km = parseFloat(btn.dataset.km);
      entries = entries.filter(e=>e.km !== km);
      persist();
      render();
    });
  });
}

$('add-btn').addEventListener('click', ()=>{
  const date = $('in-date').value;
  const km = parseFloat($('in-km').value);
  const liters = parseFloat($('in-liters').value);
  const err = $('err');

  if(!date || isNaN(km) || isNaN(liters) || km<=0 || liters<=0){
    err.textContent = 'Omple la data, el quilometratge i els litres amb valors vàlids.';
    err.style.display='block';
    return;
  }
  if(entries.some(e=>e.km===km)){
    err.textContent = 'Ja hi ha un repostatge amb aquest quilometratge.';
    err.style.display='block';
    return;
  }
  err.style.display='none';
  entries.push({date, km, liters});
  persist();
  $('in-km').value=''; $('in-liters').value='';
  render();
});

$('reset-btn').addEventListener('click', ()=>{
  if(confirm('Vols esborrar tots els repostatges? Aquesta acció no es pot desfer.')){
    entries = [];
    persist();
    render();
  }
});

function setNote(msg, cls){ const n=$('backup-note'); n.textContent=msg; n.className='note'+(cls?' '+cls:''); }

$('export-btn').addEventListener('click', async ()=>{
  if(entries.length===0){ setNote('No hi ha repostatges per exportar.', 'bad'); return; }
  const fileName = KEY+'-'+new Date().toISOString().slice(0,10)+'.json';
  const payload = JSON.stringify({app:KEY, version:1, entries}, null, 2);
  const file = new File([payload], fileName, {type:'application/json'});
  try{
    if(navigator.canShare && navigator.canShare({files:[file]})){
      await navigator.share({files:[file], title:fileName});
      setNote('Fitxer compartit: '+fileName, 'ok');
      return;
    }
  }catch(e){
    if(e && e.name==='AbortError') return;
  }
  const url = URL.createObjectURL(file);
  const a = document.createElement('a');
  a.href = url; a.download = fileName;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 1000);
  setNote('Fitxer descarregat: '+fileName, 'ok');
});

$('import-file').addEventListener('change', async (ev)=>{
  const f = ev.target.files[0];
  ev.target.value = '';
  if(!f) return;
  try{
    const data = JSON.parse(await f.text());
    const list = Array.isArray(data) ? data : data.entries;
    if(!Array.isArray(list)) throw new Error('formato');
    const valid = list.filter(e => e && typeof e.date==='string' && Number.isFinite(e.km) && Number.isFinite(e.liters) && e.km>0 && e.liters>0)
                      .map(e => ({date:e.date, km:e.km, liters:e.liters}));
    if(valid.length===0) throw new Error('vacío');
    const known = new Set(entries.map(e=>e.km));
    const fresh = valid.filter(e=>!known.has(e.km));
    entries = entries.concat(fresh);
    persist();
    render();
    const dup = valid.length - fresh.length;
    setNote('Importats '+fresh.length+' repostatges'+(dup? ' ('+dup+' ja hi eren)':'')+'.', 'ok');
  }catch(e){
    setNote('No s\'ha pogut llegir el fitxer. Tria un fitxer exportat des d\'aquesta app.', 'bad');
  }
});

render();

if('serviceWorker' in navigator){
  navigator.serviceWorker.register('service-worker.js');
}
</script>
</body>
</html>
